name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OCTOP_RAILWAY_IMAGE: octop-railway:candidate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Static checks
        run: tests/static.sh

      - name: Build the candidate image
        run: docker compose build --pull

      - name: Smoke tests
        env:
          OCTOP_TEST_ADMIN_PASSWORD: ciOnlyAdminPassword000
        run: tests/smoke.sh

      - name: Persistence tests
        env:
          OCTOP_TEST_ADMIN_PASSWORD: ciOnlyAdminPassword000
        run: tests/persistence.sh

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200 || true

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true
